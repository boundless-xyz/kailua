[package]
name = "kailua-build"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[build-dependencies]
alloy-primitives = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
risc0-build = { workspace = true, optional = true }

[package.metadata.risc0]
methods = ["kona", "hokulea", "hana"]

[features]
debug-guest-build = []
disable-dev-mode = []
rebuild-fpvm = [
    "dep:alloy-primitives",
    "dep:bytemuck",
    "dep:risc0-build"
]
eigen = []
celestia = []
# Build the FPVM guest ELFs with the experimental R0VM-accelerated revm
# `Crypto` provider enabled. Off by default until `risc0-crypto` has been
# fully audited. Selecting this changes the guest image id.
r0vm-crypto = []
