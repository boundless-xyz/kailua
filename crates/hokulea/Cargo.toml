[package]
name = "kailua-hokulea"
description = "EigenDA support for Kailua's RISC Zero FPVM"
version = "1.3.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.92.0"
authors = ["hashcashier"]
homepage = "https://boundless-xyz.github.io/kailua/"
documentation = "https://boundless-xyz.github.io/kailua/"
repository = "https://github.com/boundless-xyz/kailua"
keywords = ["zkvm", "ethereum", "optimism", "fault", "proof"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

[dependencies]
kailua-kona.workspace = true

alloy-primitives.workspace = true
bincode.workspace = true

kona-derive.workspace = true
kona-genesis.workspace = true
kona-preimage.workspace = true
kona-proof.workspace = true

risc0-steel.workspace = true

canoe-bindings.workspace = true
canoe-provider.workspace = true
canoe-verifier.workspace = true
canoe-verifier-address-fetcher.workspace = true
eigenda-cert.workspace = true
hokulea-eigenda.workspace = true
hokulea-proof.workspace = true
hokulea-zkvm-verification.workspace = true

[features]
experimental = [
    "kailua-kona/experimental"
]
