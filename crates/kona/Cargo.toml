[package]
name = "kailua-kona"
version = "1.3.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.92.0"
authors = ["hashcashier"]
homepage = "https://risc0.github.io/kailua/"
repository = "https://github.com/risc0/kailua"
keywords = ["zkvm", "ethereum", "optimism", "fault", "proof"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
c-kzg.workspace = true
lazy_static.workspace = true
pot.workspace = true
rkyv.workspace = true
serde.workspace = true
serde_json.workspace = true
spin.workspace = true
tracing.workspace = true

alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-evm.workspace = true
alloy-rlp.workspace = true
alloy-op-evm.workspace = true
alloy-primitives.workspace = true
alloy-rpc-types-beacon.workspace = true
alloy-rpc-types-engine.workspace = true
alloy-trie.workspace = true

op-alloy-consensus.workspace = true
op-alloy-rpc-types-engine.workspace = true

kona-driver.workspace = true
kona-derive.workspace = true
kona-executor.workspace = true
kona-genesis.workspace = true
kona-mpt.workspace = true
kona-preimage.workspace = true
kona-proof.workspace = true
kona-protocol.workspace = true

risc0-zkvm.workspace = true

[target.'cfg(all(target_os = "zkvm", target_vendor = "risc0"))'.dependencies]
risc0-crypto-evm = { version = "=0.1.0-rc.1", optional = true }

[features]
# Opt in to the R0VM-accelerated revm `Crypto` provider backed by
# `risc0-crypto-evm`. Off by default until `risc0-crypto` has been fully
# audited. Only takes effect when the consuming crate is built for the
# zkVM target; on host targets this feature is a no-op.
r0vm-crypto = ["dep:risc0-crypto-evm"]

[dev-dependencies]
alloy = { workspace = true, features = ["genesis"] }
copy_dir.workspace = true
futures.workspace = true
kona-cli.workspace = true
kona-host.workspace = true
rayon.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[features]
experimental = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }
