[workspace.package]
version = "1.3.1-rc.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.92.0"
authors = ["hashcashier"]
homepage = "https://boundless-xyz.github.io/kailua/"
repository = "https://github.com/boundless-xyz/kailua"
keywords = ["zkvm", "ethereum", "optimism", "fault", "proof"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

[workspace]
resolver = "2"
members = [
    "bin/*",
    "build/*",
    "crates/*",
]
exclude = []

[workspace.dependencies]
anyhow = "1.0.98"
ark-ff = "0.5.0"
async-channel = "2.3.1"
async-trait = "0.1.89"
aws-config = "1.5.15"
aws-sdk-kms = "1.58.0"
aws-sdk-s3 = "1.58.0"
bincode = "1.3.3"
blst = "0.3.15"
bytemuck = "1.12"
c-kzg = "2.1.5"
chrono = "0.4.42"
clap = { version = "4.5.21", features = ["derive", "env", "color"] }
copy_dir = "0.1.3"
csv = "1.4.0"
foundry-compilers = "0.11.0"
futures = "0.3.31"
gcloud-sdk = { version = "0.29", default-features = false, features = ["google-cloud-kms-v1", "tls-webpki-roots"] }
hex = "0.4.3"
human_bytes = "0.4.3"
humantime = "2.3.0"
itertools = "0.14.0"
lazy_static = "1.5.0"
jsonrpsee = { version = "0.25.1", features = ["full"] }
paste = "1.0.15"
pot = "3.0.1"
rand = "0.9.2"
rayon = "1.10.0"
reqwest = { version = "0.13.2", features = ["json"] }
rkyv = { version = "0.8.16", features = ["hashbrown-0_15", "hashbrown-0_16", "hashbrown-0_17", "std"] }
rocksdb = "0.24.0"
rustls = { version = "0.23.36", features = ["ring"] }
serde = { version = "1.0", features = ["derive", "alloc", "std"] }
serde_json = "1.0.127"
spin = { version = "0.10.0", features = ["mutex"] }
tempfile = "3.20.0"
thiserror = "2.0.18"
thousands = "0.2.0"
tokio = { version = "1.49.0", features = ["full"] }
tokio-rayon = "2.1.0"
tokio-retry = "0.3.0"
url = { version = "2.5.4", features = ["serde"]}

# Telemetry
opentelemetry = "0.27.1"
opentelemetry_sdk = { version = "0.27.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27.0", features = ["tonic"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Alloy
alloy = { version = "2.0.4", default-features = false, features = ["json"] }
alloy-consensus = { version = "2.0.4", default-features = false, features = ["serde"] }
alloy-eips = { version = "2.0.4", default-features = false, features = ["kzg"] }
alloy-evm = { version = "0.34.0", default-features = false }
alloy-op-evm = { version = "0.32.0", default-features = false }
op-revm = { version = "20.0.0", default-features = false }
alloy-rlp = "0.3.13"
alloy-primitives = { version = "1.5.6", default-features = false, features = ["map-hashbrown", "rkyv", "tiny-keccak"] }
alloy-rpc-types-beacon = "2.0.4"
alloy-rpc-types-engine = { version = "2.0.4", default-features = false }
alloy-trie = { version = "0.9.4", default-features = false, features = ["std", "ethereum"] }

# OP Alloy
op-alloy-consensus = { version = "2.0.0", default-features = false, features = ["serde"] }
op-alloy-rpc-types-engine = { version = "2.0.0", default-features = false, features = ["serde"] }
op-alloy-network = { version = "2.0.0", default-features = false, features = ["serde"] }

# Kailua
kailua-build = { path = "build/risczero" }
kailua-kona = { path = "crates/kona" }
kailua-hokulea = { path = "crates/hokulea" }
kailua-hana = { path = "crates/hana" }
kailua-contracts = { path = "crates/contracts" }
kailua-proposer = { path = "crates/proposer" }
kailua-prover = { path = "crates/prover" }
kailua-rpc = { path = "crates/rpc" }
kailua-sync = { path = "crates/sync" }
kailua-validator = { path = "crates/validator" }

# Kona git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2"
kona-cli = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2", default-features = false }
kona-derive = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2", default-features = false, features = ["serde"] }
kona-driver = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }
kona-executor = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }
kona-genesis = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }
kona-host = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2", default-features = false, features = ["single"] }
kona-mpt = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2", features = ["serde"] }
kona-preimage = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2", features = ["serde", "rkyv", "std"] }
kona-proof = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }
kona-protocol = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }
kona-providers-alloy = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }
kona-registry = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }
kona-std-fpvm = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }

# Hokulea git = "https://github.com/Layr-Labs/hokulea", rev = "ffb0b62b6b0006683f3878617765653826d10645"
canoe-bindings = { git = "https://github.com/Layr-Labs/hokulea", rev = "ffb0b62b6b0006683f3878617765653826d10645" }
canoe-provider = { git = "https://github.com/Layr-Labs/hokulea", rev = "ffb0b62b6b0006683f3878617765653826d10645" }
canoe-verifier = { git = "https://github.com/Layr-Labs/hokulea", rev = "ffb0b62b6b0006683f3878617765653826d10645" }
canoe-verifier-address-fetcher = { git = "https://github.com/Layr-Labs/hokulea", rev = "ffb0b62b6b0006683f3878617765653826d10645" }
eigenda-cert = { git = "https://github.com/Layr-Labs/hokulea", rev = "ffb0b62b6b0006683f3878617765653826d10645" }
hokulea-compute-proof = { git = "https://github.com/Layr-Labs/hokulea", rev = "ffb0b62b6b0006683f3878617765653826d10645", default-features = false }
hokulea-eigenda = { git = "https://github.com/Layr-Labs/hokulea", rev = "ffb0b62b6b0006683f3878617765653826d10645", default-features = false }
hokulea-host-bin = { git = "https://github.com/Layr-Labs/hokulea", rev = "ffb0b62b6b0006683f3878617765653826d10645", default-features = false }
hokulea-proof = { git = "https://github.com/Layr-Labs/hokulea", rev = "ffb0b62b6b0006683f3878617765653826d10645", default-features = false }
hokulea-witgen = { git = "https://github.com/Layr-Labs/hokulea", rev = "ffb0b62b6b0006683f3878617765653826d10645", default-features = false }
hokulea-zkvm-verification = { git = "https://github.com/Layr-Labs/hokulea", rev = "ffb0b62b6b0006683f3878617765653826d10645" }

# Hana git = "https://github.com/celestiaorg/hana", rev = "2ee58680ff1ca90fe41b4ea69d4281b93cd67d29"
celestia-rpc = "0.14.0"
celestia-types = "0.16.0"
hana-blobstream = { git = "https://github.com/celestiaorg/hana", rev = "2ee58680ff1ca90fe41b4ea69d4281b93cd67d29", default-features = false }
hana-celestia = { git = "https://github.com/celestiaorg/hana", rev = "2ee58680ff1ca90fe41b4ea69d4281b93cd67d29", default-features = false }
hana-host = { git = "https://github.com/celestiaorg/hana", rev = "2ee58680ff1ca90fe41b4ea69d4281b93cd67d29", default-features = false }
hana-oracle = { git = "https://github.com/celestiaorg/hana", rev = "2ee58680ff1ca90fe41b4ea69d4281b93cd67d29", default-features = false }

# Bonsai
bonsai-sdk = { version = "1.4.1", features = ["non_blocking"] }

# RISC Zero
risc0-build = { version = "3.0.5", features = ["unstable"] }
risc0-circuit-recursion = "4.0.4"
risc0-ethereum-contracts = "3.0.1"
risc0-zkvm = { version = "3.0.5", features = ["heap-embedded-alloc", "unstable"] }

# Boundless
boundless-market = { version = "1.4", features = ["gcs", "s3"] }

# STEEL
risc0-steel = { git = "https://github.com/boundless-xyz/steel", branch = "release-3.0" }

[profile.dev]
opt-level = 3

[profile.release]
codegen-units = 16
debug = 1
lto = "thin"
overflow-checks = true

[profile.release.build-override]
codegen-units = 1
opt-level = 3

[patch.crates-io]
# Duplicated by: reth-payload-primitives, reth-engine-local (reth git), rollup-boost,
# rollup-boost-types (crates.io)
op-alloy-rpc-types-engine = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }
# Duplicated by: reth-codecs, reth-db-api, reth-primitives-traits, reth-rpc-convert (reth git)
op-alloy-consensus = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }
# Duplicated by: reth-rpc-convert (reth git)
op-alloy-network = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }
# Duplicated by: reth-rpc-convert (reth git)
op-alloy-rpc-types = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }
# Duplicated by: alloy-evm (crates.io)
op-alloy = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }
# Duplicated by: alloy-evm (crates.io)
alloy-op-hardforks = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }
# Duplicated by: hokulea (local path dep, its own [patch] doesn't apply)
alloy-op-evm = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }
op-revm = { git = "https://github.com/ethereum-optimism/optimism", tag = "kona-client/v1.5.2" }